name: Test

on:
    push:
    pull_request:

jobs:
    test:
        name: Node ${{ matrix.node }} (${{ matrix.runtime }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - node: 24
                      runtime: Asyncify
                    - node: 25
                      runtime: JSPI
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
            - run: node test/index.ts
